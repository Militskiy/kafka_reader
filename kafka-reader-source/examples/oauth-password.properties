# OAuth password grant. Replace broker, topic and token endpoint with your service settings.
bootstrap.servers=broker.example:9092
security.protocol=SASL_SSL
sasl.mechanism=OAUTHBEARER
oauth.grant.type=password
oauth.token.endpoint.uri=https://sso.example/realms/example/protocol/openid-connect/token
oauth.client.id=kafka-lifetime
oauth.max.token.expiry.seconds=300
reader.topic=example.events
# In Authentication, enter your domain login and password. Windows can remember them.
# CLI: add sasl.username and sasl.password to a private copy.
# These correspond to oauth.password.grant.username and oauth.password.grant.password
# inside a Strimzi JAAS configuration.
# ssl.ca.location=/path/to/kafka-ca.pem
# oauth.ssl.ca.location=/path/to/sso-ca.pem
