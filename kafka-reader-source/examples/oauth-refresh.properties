# Public-client refresh grant. Set the broker, topic and SSO endpoint for your environment.
bootstrap.servers=broker.example:9092
security.protocol=SASL_SSL
sasl.mechanism=OAUTHBEARER
oauth.token.endpoint.uri=https://sso.example/realms/example/protocol/openid-connect/token
oauth.client.id=kafka-cli
oauth.max.token.expiry.seconds=300
reader.topic=example.events
# In Authentication, enter the refresh token. On Windows, Remember is optional.
# For CLI use, add oauth.refresh.token to a private local copy.
# ssl.ca.location=/path/to/kafka-ca.pem
# oauth.ssl.ca.location=/path/to/sso-ca.pem
