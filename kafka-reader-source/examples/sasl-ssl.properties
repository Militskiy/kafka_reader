# Open this profile, enter a real broker/topic/username, then enter the password
# in Connection security. Saving a profile omits the password.
bootstrap.servers=YOUR_BROKER:9093
security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.username=YOUR_USERNAME
isolation.level=read_committed
enable.ssl.certificate.verification=true
ssl.endpoint.identification.algorithm=https
reader.topic=YOUR_TOPIC
# Uncomment and adjust if a private CA is required:
# ssl.ca.location=C:/certs/ca.pem
# For a protected CLI-only file, supply sasl.password=YOUR_PASSWORD.
# PLAIN and SCRAM-SHA-256 are also supported mechanism choices.
