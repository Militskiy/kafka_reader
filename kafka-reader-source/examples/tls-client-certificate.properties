# PEM certificates are used by the native librdkafka client.
bootstrap.servers=YOUR_BROKER:9093
security.protocol=SSL
ssl.ca.location=C:/certs/ca.pem
ssl.certificate.location=C:/certs/client.pem
ssl.key.location=C:/certs/client-key.pem
enable.ssl.certificate.verification=true
ssl.endpoint.identification.algorithm=https
isolation.level=read_committed
reader.topic=YOUR_TOPIC
# Supply an encrypted key's ssl.key.password in session advanced properties.
# It will be omitted when saving the profile.
