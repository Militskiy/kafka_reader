[package]
name = "kafka-reader-rust"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A native, read-only Kafka topic inspector"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "x11"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
crossbeam-channel = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(windows))'.dependencies]
rdkafka = { version = "=0.39.0", default-features = false, features = ["cmake-build", "ssl-vendored", "libz-static", "zstd"] }

[target.'cfg(windows)'.dependencies]
rdkafka = { version = "=0.39.0", default-features = false, features = ["cmake-build", "ssl-vendored", "libz-static", "zstd"] }

[profile.release]
opt-level = 2
strip = true
lto = "thin"
codegen-units = 8

